
[package]
authors = ["Rob Moran <thegecko@github.com>"]
edition = "2021"
name = "webbluetooth"
version = "7.0.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
futures-lite = "2.6.1"
napi = { version = "3.12.1", features = ["tokio_rt"] }
napi-derive = "3.6.3"
btleplug = "0.13.0"
tokio = { version = "1.52.3", features = ["rt", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9.12", features = ["vendored"] }

[build-dependencies]
napi-build = "2.3.2"

[profile.release]
lto = true
strip = "symbols"
